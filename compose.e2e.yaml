name: ${COMPOSE_PROJECT_NAME:-barber-e2e}
services:
  db-e2e:
    image: postgres:18.6-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
    tmpfs: ['/var/lib/postgresql:rw,noexec,nosuid,size=512m']
    ports: ['${E2E_DB_PORT:-55432}:5432']
    volumes:
      - ./database/init/00-bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./database:/opt/app-sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d barber_calendar_e2e && psql -U postgres -d barber_calendar_e2e -tAc "SELECT revision=''001-tenant-authentication-v3'' FROM app_meta.schema_build WHERE singleton" | grep -qx t',
        ]
      interval: 2s
      timeout: 5s
      retries: 45
    networks: [e2e]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['${E2E_SMTP_PORT:-51025}:1025', '${E2E_MAILPIT_PORT:-58025}:8025']
    networks: [e2e]
networks: { e2e: { internal: false } }
