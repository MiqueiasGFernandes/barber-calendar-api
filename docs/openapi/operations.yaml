openapi: 3.1.0
info:
  title: Operação da Barber Calendar API
  version: 1.0.0
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verificar se o processo HTTP está respondendo
      description: Não consulta o banco nem garante compatibilidade de schema. Não exige autenticação.
      tags: [Operação]
      security: []
      responses:
        '200':
          description: Processo HTTP respondendo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /ready:
    get:
      operationId: getReadiness
      summary: Verificar conexão com o banco e revisão de schema suportada
      description: Retorna 500 quando a consulta ao banco falha ou a revisão não é suportada. Não executa atualização do banco. Não exige autenticação.
      tags: [Operação]
      security: []
      responses:
        '200':
          description: Banco acessível com revisão suportada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, schema_revision]
                properties:
                  status: { type: string, const: ready }
                  schema_revision: { type: string, const: 002-appointment-scheduling-v2 }
        '500':
          description: Dependência indisponível ou schema incompatível; detalhes técnicos somente nos logs
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, const: 500 }
        code: { type: string, const: internal_error }
        correlation_id: { type: string, format: uuid }
