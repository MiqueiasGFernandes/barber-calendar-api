openapi: 3.1.0
info:
  title: API de Autenticação sem Senha da Barber Calendar
  version: 1.3.0
  description: >-
    Contrato fonte para cadastro provisório e login por OTP enviado exclusivamente
    por e-mail.
servers:
  - url: /v1
paths:
  /tenants/register:
    post:
      operationId: startTenantRegistration
      summary: Iniciar cadastro provisório e verificar o primeiro administrador por e-mail
      tags: [Cadastro]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantRegistrationRequest' }
      responses:
        '201':
          description: Tentativa provisória criada; nenhum tenant, conta ou vínculo definitivo existe ainda
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAttemptResponse' }
        '409': { $ref: '#/components/responses/RegistrationConflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp-requests:
    post:
      operationId: requestLoginOtp
      summary: Solicitar um código de login por e-mail
      description: >-
        Retorna a mesma confirmação para identidades conhecidas, desconhecidas,
        não confirmadas, suspensas e sem vínculo elegível.
      tags: [Autenticação]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: Aceito com preservação de privacidade; não garante entrega
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResponse' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp-verifications:
    post:
      operationId: verifyAuthenticationOtp
      summary: Consumir OTP de cadastro ou login e criar sessão restrita ao tenant
      tags: [Autenticação]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerificationRequest' }
      responses:
        '200':
          description: >-
            OTP consumido; no cadastro, os registros definitivos foram criados
            atomicamente antes da emissão do token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/InvalidOtp' }
        '409': { $ref: '#/components/responses/RegistrationConflict' }
        '422': { $ref: '#/components/responses/ValidationFailure' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TenantRegistrationRequest:
      type: object
      additionalProperties: false
      required: [tenant_name, tenant_slug, administrator_email]
      properties:
        tenant_name:
          type: string
          minLength: 1
          maxLength: 160
        tenant_slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 80
        administrator_email:
          type: string
          format: email
          maxLength: 254
          writeOnly: true

    RegistrationAttemptResponse:
      type: object
      additionalProperties: false
      required: [registration_attempt_id, status, challenge_id, expires_in, resend_after]
      properties:
        registration_attempt_id: { type: string, format: uuid }
        status: { type: string, const: verification_required }
        challenge_id: { type: string, format: uuid }
        expires_in: { type: integer, const: 600 }
        resend_after: { type: integer, const: 60 }

    OtpRequest:
      type: object
      additionalProperties: false
      required: [tenant_slug, email]
      properties:
        tenant_slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
          writeOnly: true

    OtpRequestResponse:
      type: object
      additionalProperties: false
      required: [status, challenge_id, expires_in, resend_after]
      properties:
        status: { type: string, const: accepted }
        challenge_id:
          type: string
          format: uuid
          description: Identificador opaco; não comprova conta, contato ou entrega.
        expires_in: { type: integer, const: 600 }
        resend_after: { type: integer, const: 60 }

    OtpVerificationRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6
          writeOnly: true

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: >-
            JWT restrito ao tenant. Não contém e-mail ou OTP; sua expiração é a
            expiração imutável da sessão criada nesta verificação.
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          minimum: 900
          maximum: 604800
          default: 86400
          examples: [86400]
          description: >-
            Duração da nova sessão em segundos, definida pela configuração vigente
            na emissão; usa 24 horas quando nenhuma configuração é fornecida.

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        correlation_id: { type: string, format: uuid }
        retry_after_seconds: { type: integer, minimum: 1 }

  responses:
    RegistrationConflict:
      description: Um identificador de cadastro ficou indisponível; nenhum estado parcial permanece
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidOtp:
      description: >-
        A operação falhou sem indicar se desafio, código, contato, conta,
        tenant ou vínculo era inválido, expirado, consumido, substituído ou bloqueado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailure:
      description: Os dados enviados não atendem ao schema público
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Tente novamente mais tarde; a resposta não identifica o escopo limitado
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
